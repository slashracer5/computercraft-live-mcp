[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "computercraft-live-mcp"
version = "0.1.0"
description = "Live, in-world control of ComputerCraft: Tweaked computers for AI assistants: MCP server and relay to run Lua, read and write files, call peripherals and see errors on a real computer in a running Minecraft world."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "slashracer5" }]
keywords = ["mcp", "model-context-protocol", "computercraft", "cc-tweaked", "minecraft", "lua", "claude"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Lua",
    "Topic :: Games/Entertainment",
]
dependencies = [
    "aiohttp>=3.9",
    "mcp>=2.3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.17.5"]

[project.urls]
Homepage = "https://github.com/slashracer5/computercraft-live-mcp"
Issues = "https://github.com/slashracer5/computercraft-live-mcp/issues"

[project.scripts]
computercraft-live-mcp = "computercraft_live_mcp.mcp_server:main"          # the MCP server (stdio)
computercraft-live-mcp-relay = "computercraft_live_mcp.relay:main"         # the relay the in-game computer connects to
ccctl = "computercraft_live_mcp.ccctl:cli"                            # command-line client for the relay

[tool.hatch.build.targets.wheel]
packages = ["src/computercraft_live_mcp"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "docs", "examples", "README.md", "LICENSE", "SECURITY.md"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = [".worktrees"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["e2e: end-to-end checks inside headless CraftOS-PC"]
addopts = "-ra"
asyncio_default_fixture_loop_scope = "function"
